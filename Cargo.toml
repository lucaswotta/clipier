[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lucaswotta/leme-pier"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A library for one application: the error and panic sections of a public API do not apply.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
