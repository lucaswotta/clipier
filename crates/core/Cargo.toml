[package]
name = "leme-core"
description = "What Leme Pier does, without a window: agents, conversations, worktrees, races and crews."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session ids and run names need randomness on every platform.
getrandom = "0.3"
# Talks to api.github.com, and only when the user asks for a pull request.
ureq = { version = "3", default-features = false, features = ["rustls", "json"], optional = true }

[features]
default = ["github"]
# Opening a pull request. Off, the core builds without a TLS stack, which the Windows lint on Linux needs.
github = ["dep:ureq"]

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# killpg: a cancelled or stalled agent is ended together with everything it started.
libc = "0.2"
