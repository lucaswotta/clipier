[package]
name = "leme-core"
description = "What Leme Pier does, without a window: agents, conversations, worktrees, races and crews."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session ids and run names need randomness on every platform.
getrandom = "0.3"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# killpg: a cancelled or stalled agent is ended together with everything it started.
libc = "0.2"
