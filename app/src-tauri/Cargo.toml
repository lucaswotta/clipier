[package]
name = "leme-pier-app"
description = "The Leme Pier window: commands over the core, nothing else."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "leme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
leme-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Serve the interface from the binary instead of the dev server: what `tauri build` turns on.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
